name: CI

# Runs the Full Check from AGENTS.md on macOS, and the build-and-test subset on Linux and Windows
# (allowed to fail until phase 4 lands).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (${{ matrix.preset }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan-ubsan, tsan, x86_64]
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.preset == 'debug' && '-DOFXGRIP_BUILD_RUST=ON' || '' }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Validate bundles
        run: python3 scripts/validate-bundle.py build/${{ matrix.preset }}/plugins
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing
          retention-days: 14

  coverage:
    name: macOS coverage
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake --preset coverage
      - name: Build
        run: cmake --build --preset coverage
      - name: Test
        run: ctest --preset coverage
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/coverage/profiles/%p-%m.profraw
      - name: Report
        run: scripts/coverage.sh build/coverage

  linux:
    name: Linux x86_64 (phase 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  windows:
    name: Windows x64 (phase 4)
    runs-on: windows-2025
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Visual Studio developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        run: choco install ninja -y
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows
      - name: Test
        run: ctest --preset windows
